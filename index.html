<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#090913">
<meta name="description" content="A private, browser-local project and task workspace.">
<title>Northstar — Business Operations</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
  <div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.8 14.4 9.6 21.2 12l-6.8 2.4L12 21.2l-2.4-6.8L2.8 12l6.8-2.4L12 2.8Z" fill="currentColor"/><circle cx="12" cy="12" r="2.3" fill="#b39bff"/></svg></div><div><strong>NORTHSTAR</strong><small>Business operations</small></div></div>
  <div><div class="nav-label">Workspace</div><nav class="nav" id="nav">
    <button data-view="overview" class="active"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.7"/><rect x="13.5" y="3.5" width="7" height="4.5" rx="1.7"/><rect x="13.5" y="11" width="7" height="9.5" rx="1.7"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.7"/></svg></span>Overview</button>
    <button data-view="projects"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 6.5h6l2 2h8a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18V8A1.5 1.5 0 0 1 4 6.5Z"/><path d="M2.8 10.5h18.4"/></svg></span>Projects</button>
    <button data-view="tasks"><span class="ico"><svg viewBox="0 0 24 24"><path d="M8 5h12M8 12h12M8 19h12"/><path d="m3 5 1.2 1.2L6 4.5M3 12l1.2 1.2L6 11.5M3 19l1.2 1.2L6 18.5"/></svg></span>Tasks</button>
    <button data-view="board"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="10" rx="1.5"/><rect x="16" y="4" width="5" height="13" rx="1.5"/></svg></span>Kanban board</button>
    <button data-view="timeline"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.3 2"/></svg></span>Timeline</button>
    <button data-view="weekly"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 18.5a8.5 8.5 0 1 1 16 0"/><path d="M12 12 17 8M7.5 18.5h9"/><circle cx="12" cy="12" r="1.1"/></svg></span>Weekly review</button>
    <button data-view="notes"><span class="ico"><svg viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2Z"/><path d="M14 3.8v4h4M8 12h8M8 16h8"/></svg></span>Notes & reports</button>
    <button data-view="sources"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6 6 18"/></svg></span>Data & connections</button>
  </nav></div>
  <div class="side-bottom"><div class="local-note"><span class="privacy-mark">✦</span><div><b>Private by design</b>Projects, tasks and notes stay in this browser. This site has no live account connections.</div></div><button class="btn ghost side-export" id="exportBtn">⇩ <span>Export workspace</span></button><button class="btn ghost side-export" id="importBtn">⇧ <span>Import backup</span></button><input type="file" id="importFile" accept="application/json,.json" class="hidden"></div>
</aside>
<main class="main">
  <header class="topbar"><div class="topbar-left"><button class="btn icon-btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><div class="topbar-title"><div class="eyebrow" id="eyebrow">Operations workspace</div><h1 class="page-title" id="pageTitle">Overview</h1></div></div><div class="topbar-right"><span class="workspace-status"><i></i> Local workspace</span><button class="btn hide-mobile" data-action="new-note">＋ Note</button><button class="btn hide-mobile" data-action="new-project">＋ Project</button><button class="btn primary" data-action="new-task"><span>＋</span><span>New task</span></button><button class="btn icon-btn" id="themeBtn" aria-label="Switch theme" title="Switch theme">◐</button></div></header>
  <div class="content" id="content"></div>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const KEY='northstar_ops_workspace_v1';
const statuses=['backlog','todo','in_progress','blocked','done'];
const statusLabels={backlog:'Backlog',todo:'To do',in_progress:'In progress',blocked:'Blocked',done:'Done'};
const priorityLabels={urgent:'Urgent',high:'High',normal:'Normal',low:'Low'};
const emptyState=()=>({projects:[],tasks:[],notes:[],activity:[],theme:'dark',themeVersion:2,lastWeeklyReview:null});
let state=load();let view='overview';let filterText='';let filterStatus='all';let filterProject='all';let sortBy='due';let modalKind=null;let toastTimer;
const $=(s,root=document)=>root.querySelector(s);const $$=(s,root=document)=>[...root.querySelectorAll(s)];
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(!v||typeof v!=='object')return emptyState();const theme=v.themeVersion===2&&v.theme==='light'?'light':'dark';return {...emptyState(),...v,theme,themeVersion:2,projects:Array.isArray(v.projects)?v.projects:[],tasks:Array.isArray(v.tasks)?v.tasks:[],notes:Array.isArray(v.notes)?v.notes:[],activity:Array.isArray(v.activity)?v.activity:[]}}catch{return emptyState()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Could not save: browser storage may be full.');return false}}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateOnly(d){if(!d)return null;return String(d).slice(0,10)}
function localToday(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function fmtDate(d){if(!d)return 'No date';const x=new Date(d+'T00:00:00');return Number.isNaN(+x)?'No date':x.toLocaleDateString(undefined,{month:'short',day:'numeric',year:x.getFullYear()!==new Date().getFullYear()?'numeric':undefined})}
function ago(ms){if(!ms)return '';const delta=Math.max(0,Date.now()-ms);if(delta<60000)return 'just now';if(delta<3600000)return Math.floor(delta/60000)+'m ago';if(delta<86400000)return Math.floor(delta/3600000)+'h ago';return Math.floor(delta/86400000)+'d ago'}
function activeTasks(){return state.tasks.filter(t=>!t.archived&&t.status!=='done')}
function activeProjects(){return state.projects.filter(p=>!p.archived&&p.status!=='complete')}
function projectName(id){return state.projects.find(p=>p.id===id)?.name||'Unassigned'}
function logActivity(text,kind='work'){state.activity.unshift({id:uid(),text,kind,at:Date.now()});state.activity=state.activity.slice(0,50)}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500)}
function setTheme(theme){state.theme=theme;document.body.dataset.theme=theme;save();$('#themeBtn').textContent=theme==='dark'?'☼':'◐'}
function badge(s){return `<span class="priority ${esc(s)}">${esc(priorityLabels[s]||s||'Normal')}</span>`}
function statusPill(s){return `<span class="pill ${esc(s)}">${esc((statusLabels[s]||s||'Active').replace('_',' '))}</span>`}
function taskIsOverdue(t){return !!t.dueDate&&t.dueDate<localToday()&&t.status!=='done'&&!t.archived}
function dueSoon(t){const now=localToday();const end=new Date(now+'T00:00:00');end.setDate(end.getDate()+7);return !!t.dueDate&&t.dueDate>=now&&t.dueDate<=end.toISOString().slice(0,10)&&t.status!=='done'&&!t.archived}
function dueRank(t){return t.dueDate||'9999-12-31'}
function priorityRank(p){return {urgent:0,high:1,normal:2,low:3}[p]??2}
function sortedOpenTasks(){return activeTasks().sort((a,b)=>priorityRank(a.priority)-priorityRank(b.priority)||dueRank(a).localeCompare(dueRank(b))||b.updatedAt-a.updatedAt)}
function taskCard(t){return `<div class="queue-item"><div class="task-copy"><strong>${esc(t.title)}</strong><small>${esc(projectName(t.projectId))} · ${t.dueDate?`Due ${esc(fmtDate(t.dueDate))}`:'No due date'}</small></div>${badge(t.priority)}<button class="btn small" data-edit-task="${esc(t.id)}">Open</button></div>`}
function projectCard(p){const ts=state.tasks.filter(t=>t.projectId===p.id&&!t.archived);const done=ts.filter(t=>t.status==='done').length;const pct=ts.length?Math.round(done/ts.length*100):0;return `<article class="project-card"><div class="project-top"><h3>${esc(p.name)}</h3>${statusPill(p.status)}</div><p>${esc(p.description||'No description yet.')}</p><div class="progress"><span style="width:${pct}%"></span></div><div class="project-stats"><span>${done} of ${ts.length} tasks done</span><span>${pct}%</span></div><div class="toolbar" style="margin:12px 0 0"><button class="btn small" data-edit-project="${esc(p.id)}">Edit</button><button class="btn small" data-project-tasks="${esc(p.id)}">View tasks</button></div></article>`}
function metric(label,value,foot,icon){return `<div class="metric"><div class="metric-head"><span>${label}</span><span class="metric-icon">${icon}</span></div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></div>`}
function render(){setTheme(state.theme==='dark'?'dark':'light');const names={overview:'Overview',projects:'Projects',tasks:'Tasks',board:'Kanban board',timeline:'Timeline',weekly:'Weekly review',notes:'Notes & reports',sources:'Data & connections'};$('#pageTitle').textContent=names[view]||'Overview';$('#eyebrow').textContent=view==='overview'?'Operations workspace':'Workspace';$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const root=$('#content');root.innerHTML=views[view]();bindViewActions()}
const views={
overview(){const projects=activeProjects(),tasks=activeTasks(),overdue=tasks.filter(taskIsOverdue),soon=tasks.filter(dueSoon),done=state.tasks.filter(t=>!t.archived&&t.status==='done').length,total=state.tasks.filter(t=>!t.archived).length,queue=sortedOpenTasks().slice(0,5),recent=state.activity.slice(0,5);return `<div class="welcome welcome-main"><div><div class="eyebrow">OPERATIONS / PRIVATE SPACE</div><h2>Your work, in focus.</h2><p>A calm command surface for projects, priorities and what’s due next. Nothing is pre-filled.</p></div><div class="top-actions"><button class="btn" data-action="new-project">＋ Create project</button><button class="btn primary" data-action="new-task">＋ Create task</button></div></div><div class="banner"><span class="badge">LOCAL</span><div><strong>Standalone edition.</strong> Projects, tasks and notes stay in this browser; no private account data is copied here.</div></div><div class="metrics">${metric('Active projects',projects.length,'Manually entered in this browser','▦')}${metric('Open tasks',tasks.length,`${done} completed of ${total} total`,'✓')}${metric('Past due',overdue.length,overdue.length?'Needs review':'No overdue tasks entered','!')}${metric('Due in 7 days',soon.length,'Based on task due dates','◷')}</div><div class="grid2"><section class="panel"><div class="panel-head"><div><h3>Priority queue</h3><p>Sorted by priority, then due date; only your open tasks.</p></div><button class="text-link" data-nav="tasks">View all →</button></div>${queue.length?`<div class="queue">${queue.map((t,i)=>`<div class="queue-item"><span class="rank">${i+1}</span><div class="task-copy"><strong>${esc(t.title)}</strong><small>${esc(projectName(t.projectId))} · ${t.dueDate?`Due ${esc(fmtDate(t.dueDate))}`:'No due date'}${taskIsOverdue(t)?' · OVERDUE':''}</small></div>${badge(t.priority)}<button class="btn small" data-edit-task="${esc(t.id)}">Open</button></div>`).join('')}</div>`:`<div class="empty"><strong>Your queue is clear.</strong>Add a task to see an evidence-based priority list here.<button class="btn primary" data-action="new-task">Create a task</button></div>`}</section><section class="panel"><div class="panel-head"><div><h3>Upcoming deadlines</h3><p>From tasks you entered—no calendar connection in this edition.</p></div><button class="text-link" data-nav="timeline">Timeline →</button></div>${soon.length?`<div class="queue">${soon.sort((a,b)=>dueRank(a).localeCompare(dueRank(b))).slice(0,5).map(taskCard).join('')}</div>`:`<div class="empty"><strong>No upcoming task dates.</strong>Add a due date to a task to see it here.</div>`}</section></div><div class="grid2"><section class="panel"><div class="panel-head"><div><h3>Projects</h3><p>${projects.length?`${projects.length} active project${projects.length===1?'':'s'}`:'Your workspace starts empty.'}</p></div><button class="text-link" data-nav="projects">All projects →</button></div>${projects.length?`<div class="project-grid">${projects.slice(0,3).map(projectCard).join('')}</div>`:`<div class="empty"><strong>No projects yet.</strong>Create one when you’re ready to organize work.<button class="btn" data-action="new-project">Create a project</button></div>`}</section><section class="panel"><div class="panel-head"><div><h3>Recent activity</h3><p>Changes made in this browser only.</p></div></div>${recent.length?`<div class="activity-list">${recent.map(a=>`<div class="activity-item"><span class="metric-icon">${a.kind==='done'?'✓':a.kind==='project'?'▦':'•'}</span><div class="task-copy"><strong>${esc(a.text)}</strong><small>${esc(ago(a.at))}</small></div></div>`).join('')}</div>`:`<div class="empty"><strong>No activity yet.</strong>Your actions will appear here.</div>`}</section></div><p class="footer-note">Completion rate is ${total?Math.round(done/total*100):0}% from manually entered tasks. Project health is based only on local task status and due dates; it does not reflect connected services.</p>`},
projects(){const list=state.projects.filter(p=>!p.archived);return `<div class="welcome"><div><h2>Projects</h2><p>Create and organize work. Everything here stays in this browser.</p></div><button class="btn primary" data-action="new-project">＋ New project</button></div><div class="toolbar"><input class="field search" id="projectSearch" placeholder="Search projects" value="${esc(filterText)}"><select class="field" id="projectStatus"><option value="all">All statuses</option><option value="active">Active</option><option value="paused">Paused</option><option value="complete">Complete</option></select></div><div class="project-grid" id="projectList">${projectCardsFiltered(list)}</div>`},
tasks(){return `<div class="welcome"><div><h2>Tasks</h2><p>Search, filter, sort and edit your personal task list.</p></div><button class="btn primary" data-action="new-task">＋ New task</button></div><div class="toolbar"><input class="field search" id="taskSearch" placeholder="Search tasks, notes or tags" value="${esc(filterText)}"><select class="field" id="taskStatus"><option value="all">All statuses</option>${statuses.map(s=>`<option value="${s}" ${filterStatus===s?'selected':''}>${statusLabels[s]}</option>`).join('')}</select><select class="field" id="taskProject"><option value="all">All projects</option>${state.projects.filter(p=>!p.archived).map(p=>`<option value="${esc(p.id)}" ${filterProject===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select class="field" id="taskSort"><option value="due" ${sortBy==='due'?'selected':''}>Sort: due date</option><option value="priority" ${sortBy==='priority'?'selected':''}>Sort: priority</option><option value="updated" ${sortBy==='updated'?'selected':''}>Sort: recently updated</option></select></div>${taskTable()}`},
board(){return `<div class="welcome"><div><h2>Kanban board</h2><p>Move tasks between columns using the status menu on each card.</p></div><button class="btn primary" data-action="new-task">＋ New task</button></div><div class="toolbar"><input class="field search" id="taskSearch" placeholder="Search tasks" value="${esc(filterText)}"><select class="field" id="taskProject"><option value="all">All projects</option>${state.projects.filter(p=>!p.archived).map(p=>`<option value="${esc(p.id)}" ${filterProject===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="board">${statuses.map(s=>{const ts=filteredTasks().filter(t=>t.status===s);return `<section class="lane"><div class="lane-head"><span>${statusLabels[s]}</span><span class="lane-count">${ts.length}</span></div><div class="lane-cards">${ts.map(t=>`<article class="kanban-card"><h4>${esc(t.title)}</h4>${t.description?`<p>${esc(t.description)}</p>`:''}<div class="kanban-foot">${badge(t.priority)}<select class="field" style="padding:5px 7px;font-size:10px" data-move-task="${esc(t.id)}" aria-label="Change task status">${statuses.map(x=>`<option value="${x}" ${t.status===x?'selected':''}>${statusLabels[x]}</option>`).join('')}</select></div><div class="task-copy" style="margin-top:8px"><small>${esc(projectName(t.projectId))} · ${t.dueDate?esc(fmtDate(t.dueDate)):'No due date'}${t.blocker?` · Blocker: ${esc(t.blocker)}`:''}</small></div><button class="text-link" data-edit-task="${esc(t.id)}" style="padding:8px 0 0">Edit task</button></article>`).join('')||`<div class="empty" style="padding:15px 8px;font-size:10px">No tasks</div>`}</div></section>`}).join('')}</div>`},
timeline(){const tasks=activeTasks().filter(t=>t.dueDate).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));const groups={};for(const t of tasks)(groups[t.dueDate]??=[]).push(t);const keys=Object.keys(groups);return `<div class="welcome"><div><h2>Timeline</h2><p>Upcoming task deadlines, grouped by date. Calendar events aren’t connected in this edition.</p></div><button class="btn primary" data-action="new-task">＋ Add task</button></div><div class="panel">${keys.length?`<div class="timeline">${keys.map(k=>`<div class="day-group"><p class="day-label">${esc(fmtDate(k))}${k<localToday()?' · PAST DUE':''}</p>${groups[k].map(t=>`<div class="row-card"><div class="task-copy"><strong>${esc(t.title)}</strong><small>${esc(projectName(t.projectId))} · ${statusLabels[t.status]||t.status}${t.blocker?` · ${esc(t.blocker)}`:''}</small></div>${badge(t.priority)}<button class="btn small" data-edit-task="${esc(t.id)}">Edit</button></div>`).join('')}</div>`).join('')}</div>`:`<div class="empty"><strong>No dated tasks.</strong>When tasks have due dates, they’ll appear here.</div>`}</div>`},
weekly(){return `<div class="welcome"><div><h2>Weekly review</h2><p>Run this when you want a grounded summary of work entered in this browser.</p></div><button class="btn primary" id="runReview">◌ Run weekly review</button></div><div class="banner"><span class="badge">ON DEMAND</span><div>This is a local review, not an automatic schedule. It won’t read connected mail, calendar, Drive, GitHub, Notion or Slack.</div></div><section class="panel"><div class="panel-head"><div><h3>Latest review</h3><p>${state.lastWeeklyReview?`Saved ${esc(new Date(state.lastWeeklyReview.at).toLocaleString())}`:'No review run yet.'}</p></div>${state.lastWeeklyReview?`<button class="btn small" id="copyReview">Copy report</button>`:''}</div>${state.lastWeeklyReview?`<div class="report" id="reviewText">${esc(state.lastWeeklyReview.text)}</div>`:`<div class="empty"><strong>Ready when you are.</strong>The review will summarize local progress, blockers, overdue dates and next priorities from your saved tasks.</div>`}</section><p class="footer-note">The review does not create tasks or send reports. You can save the result as a local note after running it.</p>`},
notes(){const notes=state.notes.filter(n=>!n.archived).sort((a,b)=>b.updatedAt-a.updatedAt);return `<div class="welcome"><div><h2>Notes & reports</h2><p>Local notes and generated weekly reports.</p></div><button class="btn primary" data-action="new-note">＋ New note</button></div><div class="notes-grid">${notes.length?notes.map(n=>`<article class="note-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><h3>${esc(n.title)}</h3><button class="text-link" data-edit-note="${esc(n.id)}">Edit</button></div><p>${esc(n.body)}</p><div class="note-date">Updated ${esc(new Date(n.updatedAt).toLocaleDateString())}</div></article>`).join(''):`<div class="empty"><strong>No notes yet.</strong>Create a note or save a weekly review.</div>`}</div>`},
sources(){const items=[['Gmail','G','Not connected to this hosted edition','Connected Gmail data stays inside Wabi; no email or account details are stored here.'],['Google Drive','D','Not connected to this hosted edition','Drive files are not copied into this public site.'],['Google Calendar','C','Not connected to this hosted edition','Add task deadlines manually here; your Wabi version can use Calendar when connected.'],['GitHub','GH','Not connected to this hosted edition','This edition does not read repositories, commits, issues or pull requests.'],['Notion / Slack','N','Not connected to this hosted edition','No workspace messages or pages are read or stored here.']];return `<div class="welcome"><div><h2>Data & connections</h2><p>Clear boundary between this public static app and your private Wabi workspace.</p></div></div><div class="banner"><span class="badge">NO SYNC</span><div><strong>This site has no connectors or server.</strong> Projects, tasks and notes stay in local browser storage on this device. They do not sync between devices or to the Wabi mini-app.</div></div><div class="source-grid">${items.map(x=>`<article class="source-card"><div class="source-head"><span class="source-logo">${x[1]}</span>${x[0]}</div><div class="source-state"><b>${x[2]}</b><br>${x[3]}</div></article>`).join('')}</div><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Backups</h3><p>Move your local data between browsers with an explicit JSON export and import.</p></div></div><div class="toolbar" style="margin:0"><button class="btn" id="exportBtn2">⇩ Export JSON</button><button class="btn" id="importBtn2">⇧ Import JSON</button></div><p class="footer-note">Imported files replace this browser’s current workspace after confirmation. Keep backups somewhere private; the export contains any notes and tasks you entered.</p></section>`}
};
function projectCardsFiltered(list){const q=filterText.toLowerCase();const status=$('#projectStatus')?.value||'all';const out=list.filter(p=>(!q||p.name.toLowerCase().includes(q)||p.description.toLowerCase().includes(q))&&(status==='all'||p.status===status));return out.length?out.map(projectCard).join(''):`<div class="empty"><strong>No projects match.</strong>Try another search or create a project.</div>`}
function filteredTasks(){let ts=state.tasks.filter(t=>!t.archived);if(filterText){const q=filterText.toLowerCase();ts=ts.filter(t=>(t.title+' '+t.description+' '+(t.tags||[]).join(' ')+' '+(t.blocker||'')).toLowerCase().includes(q))}if(filterStatus!=='all')ts=ts.filter(t=>t.status===filterStatus);if(filterProject!=='all')ts=ts.filter(t=>t.projectId===filterProject);if(sortBy==='priority')ts.sort((a,b)=>priorityRank(a.priority)-priorityRank(b.priority));else if(sortBy==='updated')ts.sort((a,b)=>b.updatedAt-a.updatedAt);else ts.sort((a,b)=>dueRank(a).localeCompare(dueRank(b)));return ts}
function taskTable(){const ts=filteredTasks();return `<div class="panel task-table-wrap"><table class="task-table"><thead><tr><th>Task</th><th>Project</th><th>Priority</th><th>Status</th><th>Due</th><th></th></tr></thead><tbody>${ts.length?ts.map(t=>`<tr><td><span class="task-title">${esc(t.title)}</span>${t.tags?.length?`<span class="task-sub">${esc(t.tags.join(' · '))}</span>`:''}</td><td>${esc(projectName(t.projectId))}</td><td>${badge(t.priority)}</td><td><select class="field" style="padding:6px 8px;font-size:10px" data-move-task="${esc(t.id)}">${statuses.map(x=>`<option value="${x}" ${t.status===x?'selected':''}>${statusLabels[x]}</option>`).join('')}</select>${t.blocker?`<span class="task-sub">${esc(t.blocker)}</span>`:''}</td><td class="${taskIsOverdue(t)?'overdue':''}">${esc(t.dueDate?fmtDate(t.dueDate):'—')}${taskIsOverdue(t)?' · overdue':''}</td><td><button class="btn small" data-edit-task="${esc(t.id)}">Edit</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty"><strong>No tasks yet.</strong>Create a task or change the filters.</div></td></tr>`}</tbody></table></div>`}
function navTo(v){view=v;filterText='';$('#sidebar').classList.remove('open');render()}
function bindViewActions(){
  $$('[data-nav]').forEach(b=>b.onclick=()=>navTo(b.dataset.nav));
  $$('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='new-task')openTask();if(b.dataset.action==='new-project')openProject();if(b.dataset.action==='new-note')openNote()});
  $$('[data-edit-task]').forEach(b=>b.onclick=()=>openTask(b.dataset.editTask));
  $$('[data-edit-project]').forEach(b=>b.onclick=()=>openProject(b.dataset.editProject));
  $$('[data-edit-note]').forEach(b=>b.onclick=()=>openNote(b.dataset.editNote));
  $$('[data-project-tasks]').forEach(b=>b.onclick=()=>{filterProject=b.dataset.projectTasks;view='tasks';render()});
  $$('[data-move-task]').forEach(el=>el.onchange=()=>{const t=state.tasks.find(x=>x.id===el.dataset.moveTask);if(!t)return;t.status=el.value;t.updatedAt=Date.now();if(t.status==='done')t.completedAt=Date.now();else t.completedAt=null;logActivity(`Moved “${t.title}” to ${statusLabels[t.status]}`,t.status==='done'?'done':'work');save();render();toast('Task updated')});
  const ps=$('#projectSearch');if(ps)ps.oninput=()=>{filterText=ps.value;const list=state.projects.filter(p=>!p.archived);$('#projectList').innerHTML=projectCardsFiltered(list);bindViewActions()};
  const pstat=$('#projectStatus');if(pstat){pstat.value=pstat.value||'all';pstat.onchange=()=>{$('#projectList').innerHTML=projectCardsFiltered(state.projects.filter(p=>!p.archived));bindViewActions()}}
  const ts=$('#taskSearch');if(ts)ts.oninput=()=>{filterText=ts.value;render()};
  const st=$('#taskStatus');if(st)st.onchange=()=>{filterStatus=st.value;render()};
  const pr=$('#taskProject');if(pr)pr.onchange=()=>{filterProject=pr.value;render()};
  const so=$('#taskSort');if(so)so.onchange=()=>{sortBy=so.value;render()};
  const run=$('#runReview');if(run)run.onclick=runWeeklyReview;
  const copy=$('#copyReview');if(copy)copy.onclick=()=>navigator.clipboard?.writeText(state.lastWeeklyReview.text).then(()=>toast('Report copied')).catch(()=>toast('Copy unavailable'));
  ['exportBtn','exportBtn2'].forEach(id=>{const b=$('#'+id);if(b)b.onclick=exportData});
  ['importBtn','importBtn2'].forEach(id=>{const b=$('#'+id);if(b)b.onclick=()=>$('#importFile').click()});
}
function openModal(title,body,footer){const m=$('#modal');m.innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="btn icon-btn" data-close aria-label="Close">×</button></div>${body}${footer||''}`;$('#modalBackdrop').classList.add('open');$('[data-close]',m).onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target===$('#modalBackdrop'))closeModal()};document.onkeydown=e=>{if(e.key==='Escape')closeModal()}}
function closeModal(){$('#modalBackdrop').classList.remove('open');modalKind=null;document.onkeydown=null}
function openProject(id=null){const p=id?state.projects.find(x=>x.id===id):null;modalKind='project';openModal(p?'Edit project':'New project',`<form id="projectForm"><div class="form-grid"><div class="form-field wide"><label for="pName">Project name *</label><input id="pName" class="field" required maxlength="100" value="${esc(p?.name||'')}"></div><div class="form-field wide"><label for="pDescription">Description</label><textarea id="pDescription" class="field" maxlength="1000">${esc(p?.description||'')}</textarea></div><div class="form-field"><label for="pStatus">Status</label><select id="pStatus" class="field"><option value="active" ${p?.status==='active'?'selected':''}>Active</option><option value="paused" ${p?.status==='paused'?'selected':''}>Paused</option><option value="complete" ${p?.status==='complete'?'selected':''}>Complete</option></select></div></div><div class="modal-actions"><div>${p?'<button type="button" class="btn danger" id="archiveProject">Archive</button>':''}</div><div class="right"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Save project</button></div></div></form>`);const f=$('#projectForm');f.onsubmit=e=>{e.preventDefault();const data={name:$('#pName').value.trim(),description:$('#pDescription').value.trim(),status:$('#pStatus').value};if(!data.name){toast('Add a project name');return}if(p){Object.assign(p,data,{updatedAt:Date.now()});logActivity(`Updated project “${data.name}”`,'project')}else{state.projects.unshift({id:uid(),...data,archived:false,createdAt:Date.now(),updatedAt:Date.now(),sourceIds:[]});logActivity(`Created project “${data.name}”`,'project')}save();closeModal();render();toast('Project saved')};const arch=$('#archiveProject');if(arch)arch.onclick=()=>{if(confirm('Archive this project? Its tasks will remain saved.')){p.archived=true;p.updatedAt=Date.now();logActivity(`Archived project “${p.name}”`,'project');save();closeModal();render();toast('Project archived')}}}
function openTask(id=null){const t=id?state.tasks.find(x=>x.id===id):null;modalKind='task';const projectOpts=state.projects.filter(p=>!p.archived).map(p=>`<option value="${esc(p.id)}" ${t?.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('');const depOpts=state.tasks.filter(x=>!x.archived&&x.id!==t?.id&&x.status!=='done').map(x=>`<option value="${esc(x.id)}" ${t?.dependencies?.includes(x.id)?'selected':''}>${esc(x.title)}</option>`).join('');openModal(t?'Edit task':'New task',`<form id="taskForm"><div class="form-grid"><div class="form-field wide"><label for="tTitle">Task title *</label><input id="tTitle" class="field" required maxlength="160" value="${esc(t?.title||'')}"></div><div class="form-field wide"><label for="tDescription">Description</label><textarea id="tDescription" class="field" maxlength="2000">${esc(t?.description||'')}</textarea></div><div class="form-field"><label for="tPriority">Priority</label><select id="tPriority" class="field">${Object.entries(priorityLabels).map(([k,v])=>`<option value="${k}" ${t?.priority===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="form-field"><label for="tStatus">Status</label><select id="tStatus" class="field">${statuses.map(s=>`<option value="${s}" ${t?.status===s?'selected':''}>${statusLabels[s]}</option>`).join('')}</select></div><div class="form-field"><label for="tDue">Due date</label><input id="tDue" class="field" type="date" value="${esc(t?.dueDate||'')}"></div><div class="form-field"><label for="tProject">Project</label><select id="tProject" class="field"><option value="">Unassigned</option>${projectOpts}</select></div><div class="form-field wide"><label for="tDeps">Depends on (select tasks)</label><select id="tDeps" class="field" multiple size="3">${depOpts}</select></div><div class="form-field wide"><label for="tBlocker">Blocker (if blocked)</label><input id="tBlocker" class="field" maxlength="300" value="${esc(t?.blocker||'')}" placeholder="What is preventing progress?"></div><div class="form-field wide"><label for="tTags">Tags (comma separated)</label><input id="tTags" class="field" maxlength="300" value="${esc((t?.tags||[]).join(', '))}" placeholder="e.g. launch, design"></div></div><div class="modal-actions"><div>${t?'<button type="button" class="btn danger" id="archiveTask">Archive</button>':''}</div><div class="right"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Save task</button></div></div></form>`);$('#taskForm').onsubmit=e=>{e.preventDefault();const title=$('#tTitle').value.trim();if(!title){toast('Add a task title');return}const status=$('#tStatus').value;const deps=$$('#tDeps option:checked').map(x=>x.value);const data={title,description:$('#tDescription').value.trim(),priority:$('#tPriority').value,status,dueDate:$('#tDue').value||null,projectId:$('#tProject').value||null,dependencies:deps,blocker:$('#tBlocker').value.trim(),tags:$('#tTags').value.split(',').map(x=>x.trim()).filter(Boolean)};if(status==='blocked'&&!data.blocker){if(!confirm('This task is marked blocked but has no blocker note. Save anyway?'))return}if(t){Object.assign(t,data,{updatedAt:Date.now(),completedAt:status==='done'?(t.completedAt||Date.now()):null});logActivity(`Updated task “${title}”`,status==='done'?'done':'work')}else{state.tasks.unshift({id:uid(),...data,archived:false,createdAt:Date.now(),updatedAt:Date.now(),completedAt:status==='done'?Date.now():null,sourceId:null});logActivity(`Created task “${title}”`,'work')}save();closeModal();render();toast('Task saved')};const arch=$('#archiveTask');if(arch)arch.onclick=()=>{if(confirm('Archive this task?')){t.archived=true;t.updatedAt=Date.now();logActivity(`Archived task “${t.title}”`,'work');save();closeModal();render();toast('Task archived')}}}
function openNote(id=null,initial=null){const n=id?state.notes.find(x=>x.id===id):null;modalKind='note';openModal(n?'Edit note':'New note',`<form id="noteForm"><div class="form-grid"><div class="form-field wide"><label for="nTitle">Title *</label><input id="nTitle" class="field" required maxlength="120" value="${esc(n?.title||initial?.title||'')}"></div><div class="form-field wide"><label for="nBody">Note</label><textarea id="nBody" class="field" style="min-height:180px" maxlength="10000">${esc(n?.body||initial?.body||'')}</textarea></div></div><div class="modal-actions"><div></div><div class="right"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Save note</button></div></div></form>`);$('#noteForm').onsubmit=e=>{e.preventDefault();const title=$('#nTitle').value.trim(),body=$('#nBody').value.trim();if(!title){toast('Add a note title');return}if(n){Object.assign(n,{title,body,updatedAt:Date.now()})}else{state.notes.unshift({id:uid(),title,body,archived:false,createdAt:Date.now(),updatedAt:Date.now()})}logActivity(`${n?'Updated':'Created'} note “${title}”`,'work');save();closeModal();render();toast('Note saved')}}
function runWeeklyReview(){const now=Date.now(),week=7*864e5;const all=state.tasks.filter(t=>!t.archived);const open=all.filter(t=>t.status!=='done');const done=all.filter(t=>t.status==='done'&&(t.completedAt||t.updatedAt)>=now-week);const overdue=open.filter(taskIsOverdue);const blocked=open.filter(t=>t.status==='blocked');const due=open.filter(dueSoon).sort((a,b)=>dueRank(a).localeCompare(dueRank(b)));const priority=open.slice().sort((a,b)=>priorityRank(a.priority)-priorityRank(b.priority)||dueRank(a).localeCompare(dueRank(b))).slice(0,3);const lines=[`WEEKLY OPERATIONS REVIEW · ${new Date().toLocaleDateString()}`,`Scope: projects and tasks stored in this browser only. No connected services were read.`,``,`PROJECTS`,`Active projects: ${activeProjects().length}. Total saved projects: ${state.projects.filter(p=>!p.archived).length}.`,``,`COMPLETED THIS WEEK`,done.length?done.map(t=>`- ${t.title} (${projectName(t.projectId)})`).join('\n'):'- No completed tasks recorded in the last 7 days.',``,`RISKS & BLOCKERS`,overdue.length?`Overdue tasks:\n${overdue.map(t=>`- ${t.title} — due ${fmtDate(t.dueDate)} (${projectName(t.projectId)})`).join('\n')}`:'No overdue tasks recorded.',blocked.length?`Blocked tasks:\n${blocked.map(t=>`- ${t.title} — ${t.blocker||'blocker not specified'} (${projectName(t.projectId)})`).join('\n')}`:'No blocked tasks recorded.',``,`UPCOMING DEADLINES`,due.length?due.map(t=>`- ${t.title} — ${fmtDate(t.dueDate)} (${projectName(t.projectId)})`).join('\n'):'No tasks due in the next 7 days.',``,`SUGGESTED NEXT PRIORITIES`,priority.length?priority.map((t,i)=>`${i+1}. ${t.title}${t.dueDate?` — due ${fmtDate(t.dueDate)}`:''}${t.priority==='urgent'||t.priority==='high'?` — ${priorityLabels[t.priority]} priority`:''}${t.status==='blocked'?` — blocked: ${t.blocker||'reason not entered'}`:''}`).join('\n'):'Add tasks with priorities and due dates to get an evidence-based queue.',``,`DECISIONS NEEDED`,`Only explicit blockers recorded in tasks are listed above. No email or meeting commitments were reviewed.`,``,`NEXT ACTIONS`,`Update dates and blockers as they change, then rerun this review when useful.`];const text=lines.join('\n');state.lastWeeklyReview={text,at:now};logActivity('Ran an on-demand weekly review','work');save();render();toast('Weekly review ready');if(confirm('Save this review as a note?'))openNote(null,{title:'Weekly review — '+new Date().toLocaleDateString(),body:text})}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='northstar-workspace-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Workspace backup exported')}
function importData(file){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||!Array.isArray(data.projects)||!Array.isArray(data.tasks)||!Array.isArray(data.notes))throw new Error('Invalid file');if(!confirm('Replace this browser’s current workspace with the imported backup?'))return;state={...emptyState(),...data};save();render();toast('Backup imported')}catch{toast('That file is not a valid workspace backup')}};reader.readAsText(file)}
$('#importFile').onchange=e=>{const f=e.target.files?.[0];if(f)importData(f);e.target.value=''};
$('#nav').onclick=e=>{const b=e.target.closest('button[data-view]');if(b)navTo(b.dataset.view)};
$('#themeBtn').onclick=()=>setTheme(state.theme==='dark'?'light':'dark');$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
$('#exportBtn').onclick=exportData;$('#importBtn').onclick=()=>$('#importFile').click();
$$('[data-action]').forEach(()=>{});
window.addEventListener('storage',e=>{if(e.key===KEY){state=load();render()}});
render();
})();
</script>
</body>
